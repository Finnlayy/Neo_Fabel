[project]
name = "neo-fabel-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "psycopg2-binary>=2.9,<3",
  "alembic>=1.15,<2",
  "firebase-admin>=7,<8",
  "httpx>=0.28,<1",
  "qdrant-client>=1.13,<2",
  "ccxt>=4.4,<5",
  # Install from PyPI (not git clone) — wheels ship the platform runtime binary.
  # Source: https://github.com/google-antigravity/antigravity-sdk-python
  "google-antigravity>=0.1.7,<1",
  "aiofiles>=24.1.0,<25",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.28,<1", "pytest-asyncio>=0.25,<1"]
lint = ["ruff>=0.9,<1", "mypy>=1.14,<2"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
