# Local Windows + Vite: API runs in Linux (Kraken CLI included).
# Frontend stays on the host: npm run dev → http://localhost:5173
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml --env-file .env.local up --build api postgres
#
services:
  api:
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: development
      AUTH_DEV_BYPASS: "false"
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080
      KRAKEN_BINARY: /usr/local/bin/kraken
      KRAKEN_AUTONOMY_LEVEL: "4"
      KRAKEN_LIVE_TRADING_ENABLED: "true"
      MARKET_STREAM_ENABLED: "true"
      MARKET_CCXT_ENABLED: "true"
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-true}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      MANUS_TELEGRAM_CHAT_ID: ${MANUS_TELEGRAM_CHAT_ID:-}
      GLINT_TELEGRAM_CHAT_ID: ${GLINT_TELEGRAM_CHAT_ID:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      ALPHAVANTAGE_API_KEY: ${ALPHAVANTAGE_API_KEY:-}
