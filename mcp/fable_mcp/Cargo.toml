[package]
name = "fable_mcp"
version = "0.1.0"
edition = "2021"
description = "Fable MCP stdio server — prompt snapshot, next-bar execution, place_order"

[[bin]]
name = "fable-mcp"
path = "src/main.rs"

[lib]
name = "fable_mcp"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "io-std", "macros", "rt-multi-thread", "sync", "net", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
pretty_assertions = "1"
