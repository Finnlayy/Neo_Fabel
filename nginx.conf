# TradingView webhook ingress — per-IP throttle (shared memory zone).
limit_req_zone $binary_remote_addr zone=tv_webhook:10m rate=10r/s;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types
    text/plain text/css text/javascript application/javascript application/json
    application/xml image/svg+xml application/wasm;
  # Do not gzip application/octet-stream (ONNX model binaries).

  location /api/v1/webhooks/tradingview/ {
    client_max_body_size 16k;
    limit_req zone=tv_webhook burst=20 nodelay;
    limit_req_status 429;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
    proxy_connect_timeout 5s;
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    # Do not log request bodies or Authorization for webhooks.
    access_log off;
  }

  # WebSocket market stream — upgrade headers only here (not on all /api/).
  location /api/v1/market/stream {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_read_timeout 86400s;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location /api/ {
    client_max_body_size 1m;
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Live JSON — no long-lived cache headers; gzip via gzip_proxied when compressible.
  }

  location /health/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed Vite build artifacts — safe to cache for a year.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  # ONNX / Netron static served by FastAPI (dev Vite proxies this; prod nginx must too).
  location /static/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "private, max-age=300";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
